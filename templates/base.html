<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Шопинг</title>
    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Шапка сайта -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'search:home' %}">Умный Шопинг</a>
            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                <a class="text-white text-decoration-none" href="{% url 'accounts:profile' %}">Профиль</a>
                <a class="text-white text-decoration-none" href="{% url 'accounts:cabinet' %}">Кабинет</a>
                <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-outline-light" type="submit">Выйти</button>
                </form>
                {% else %}
                <a class="text-white text-decoration-none" href="{% url 'accounts:login' %}">Войти</a>
                <a class="text-white text-decoration-none" href="{% url 'accounts:register' %}">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Место, куда будут вставляться другие страницы -->
    <div class="container">
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}">{{ message }}</div>
        {% endfor %}
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
