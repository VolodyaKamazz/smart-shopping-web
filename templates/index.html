{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 text-center">
        <h2>Что вы хотите купить?</h2>
        <p class="text-muted">Опишите товар, и мы найдем лучшие предложения с учетом доставки</p>

        <form class="input-group input-group-lg mt-4" method="post" action="{% url 'search:start' %}">
            {% csrf_token %}
            <input type="text" name="query" class="form-control" maxlength="300" required autofocus placeholder="Например: Смартфон до 50 000 рублей...">
            <button class="btn btn-primary" type="submit">Найти</button>
        </form>
    </div>
</div>
{% endblock %}
