{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 text-center">
        <h2>Что вы хотите купить?</h2>
        <p class="text-muted">Опишите товар, и мы найдем лучшие предложения с учетом доставки</p>
        
        <form class="input-group input-group-lg mt-4">
            <input type="text" class="form-control" placeholder="Например: Смартфон до 50 000 рублей...">
            <button class="btn btn-primary" type="button">Найти</button>
        </form>
    </div>
</div>
{% endblock %}
