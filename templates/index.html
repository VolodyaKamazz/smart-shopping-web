{% extends 'base.html' %}

{% block content %}
<section class="home text-center">
    <h1>Найди лучшее предложение</h1>
    <p class="mb-4">Сравним цены и доставку в разных магазинах</p>

    <form class="search-pill mx-auto" method="post" action="{% url 'search:start' %}">
        {% csrf_token %}
        <span class="search-icon">🔍</span>
        <input type="text" id="query" name="query" maxlength="300" required autofocus placeholder="Например, наушники до 5000 ₽">
        <button class="btn-find" type="submit">Найти</button>
    </form>

    <div class="mt-4 small">Популярные запросы:</div>
    <div class="mt-2">
        <button type="button" class="chip" data-query="Смартфон до 30 000 ₽">Смартфон до 30 000 ₽</button>
        <button type="button" class="chip" data-query="Наушники с шумоподавлением">Наушники с шумоподавлением</button>
        <button type="button" class="chip" data-query="Робот-пылесос">Робот-пылесос</button>
    </div>
</section>

<script>
  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () {
      var i = document.getElementById('query'); i.value = c.dataset.query; i.focus();
    });
  });
</script>
{% endblock %}
