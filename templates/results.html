{% extends 'base.html' %}

{% block content %}
<h4 class="mb-3">Результаты поиска: «{{ search.raw_query }}»</h4>

{% for warning in warnings %}
<div class="alert alert-warning">{{ warning }}</div>
{% endfor %}

<div id="results-app" data-api="{% url 'search:results_api' search.id %}"
     data-go="{% url 'search:go' 0 %}" data-criterion="{{ criterion }}">

  <!-- Рекомендация (заполняется из API) -->
  <div id="reco"></div>

  <!-- Управление: критерий доставки и фильтры -->
  <div class="card card-body mb-3">
    <div class="row g-3 align-items-end">
      <div class="col-lg-6">
        <div class="form-label mb-1">Что важнее при доставке</div>
        <div class="btn-group w-100" role="group" id="criteria">
          {% for value, label in criteria %}
          <button type="button" class="btn btn-outline-primary" data-criterion="{{ value }}">{{ label }}</button>
          {% endfor %}
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <label class="form-label mb-1" for="priceMax">Цена товара до, ₽</label>
        <input class="form-control" type="number" min="0" id="priceMax">
      </div>
      <div class="col-6 col-lg-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="fastDelivery">
          <label class="form-check-label" for="fastDelivery">Доставка завтра</label>
        </div>
      </div>
    </div>
  </div>

  <div id="state" class="text-muted mb-2"></div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Магазин и товар</th>
          <th class="sortable" data-sort="price">Цена</th>
          <th>Доставка</th>
          <th class="sortable" data-sort="delivery">Срок</th>
          <th class="sortable" data-sort="total">Итого</th>
          <th class="sortable" data-sort="rating">Рейтинг</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <noscript><div class="alert alert-danger">Для работы страницы нужен JavaScript.</div></noscript>
</div>
{% endblock %}
