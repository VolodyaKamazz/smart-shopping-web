{% extends 'base.html' %}

{% block content %}
<div class="row">
    <!-- Сайдбар с фильтрами -->
    <div class="col-md-3">
        <h4>Фильтры</h4>
        <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" id="fastDelivery">
            <label class="form-check-label" for="fastDelivery">Доставка завтра</label>
        </div>
        <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" id="freeDelivery">
            <label class="form-check-label" for="freeDelivery">Бесплатная доставка</label>
        </div>
    </div>

    <!-- Таблица результатов -->
    <div class="col-md-9">
        <h4>Результаты поиска</h4>
        <table class="table table-hover mt-3">
            <thead class="table-light">
                <tr>
                    <th>Магазин</th>
                    <th>Товар</th>
                    <th>Цена</th>
                    <th>Доставка</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody>
                <!-- Тестовые данные (заглушки) -->
                <tr>
                    <td>ДНС</td>
                    <td>iPhone 15 Pro</td>
                    <td>115 000 ₽</td>
                    <td>Завтра (Бесплатно)</td>
                    <td><button class="btn btn-sm btn-outline-success">В магазин</button></td>
                </tr>
                <tr>
                    <td>Ситилинк</td>
                    <td>iPhone 15 Pro</td>
                    <td>112 000 ₽</td>
                    <td>3 дня (500 ₽)</td>
                    <td><button class="btn btn-sm btn-outline-success">В магазин</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
