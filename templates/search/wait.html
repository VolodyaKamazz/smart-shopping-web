{% extends 'base.html' %}
{% block content %}
<div class="text-center mt-5" id="wait-box">
  <div class="spinner-border text-primary" role="status" id="spinner"></div>
  <h4 class="mt-3" id="title">Ищем лучшие предложения</h4>
  <p class="text-muted" id="step">{{ search.step|default:"Подождите, это займёт несколько секунд" }}</p>
  <div class="alert alert-danger d-none mt-4" id="error-box">
    Не удалось выполнить поиск.
    <a href="{% url 'search:home' %}" class="alert-link">Попробовать ещё раз</a>
  </div>
</div>

<script>
  const statusUrl = "{% url 'search:status' search.id %}";
  let failCount = 0;

  function showError() {
    clearInterval(timer);
    document.getElementById('spinner').classList.add('d-none');
    document.getElementById('title').textContent = 'Что-то пошло не так';
    document.getElementById('step').classList.add('d-none');
    document.getElementById('error-box').classList.remove('d-none');
  }

  const timer = setInterval(async () => {
    try {
      const response = await fetch(statusUrl);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      failCount = 0;

      if (data.status === 'failed') { showError(); return; }
      if (data.step) document.getElementById('step').textContent = data.step;
      if (data.redirect_url) {
        clearInterval(timer);
        window.location = data.redirect_url;
      }
    } catch (e) {
      failCount += 1;
      if (failCount >= 3) showError();  // 3 неудачи подряд - показываем ошибку
    }
  }, 1500);
</script>
{% endblock %}
