{% extends 'base.html' %}
{% block content %}
<div class="text-center mt-5">
  <div class="spinner-border" role="status"></div>
  <h4 class="mt-3">Ищем лучшие предложения</h4>
  <p class="text-muted" id="step">{{ search.step|default:"Подождите, это займёт несколько секунд" }}</p>
</div>
<script>
  // Временная заглушка: опрос статуса. Frontend заменит оформление.
  const url = "{% url 'search:status' search.id %}";
  const timer = setInterval(async () => {
    const data = await (await fetch(url)).json();
    if (data.step) document.getElementById('step').textContent = data.step;
    if (data.redirect_url) { clearInterval(timer); window.location = data.redirect_url; }
  }, 1500);
</script>
{% endblock %}
